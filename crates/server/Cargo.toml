[package]
name = "modhub-server"
description = "The modhub service: storage in PostgreSQL around the pure domain of modhub-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
modhub-core.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[[bin]]
name = "modhub"
path = "src/main.rs"

[dev-dependencies]
bolero.workspace = true
http-body-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "sync"] }
tower.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "property"
path = "tests/property/main.rs"

[[test]]
name = "fuzz"
path = "tests/fuzz/main.rs"
