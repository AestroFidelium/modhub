[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false
authors = ["AestroFidelium"]
repository = "https://gitlab.com/AestroFidelium/modhub"

[workspace.dependencies]
modhub-core = { path = "crates/core" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
semver = "1.0.28"
# The mod ABI: export names the validator checks for. Pinned to the commit the game
# builds against; bump together with the engine.
stormlight_mod_abi = { git = "https://github.com/AestroFidelium/stormlight-sdk.git", rev = "d6440ec74481e283e2381b322ceb5f3525c25129" }
# 0.244, not newer: from 0.245 wasmparser requires indexmap >= 2.13, and
# bolero-generator-derive 0.13.5 pins indexmap =2.11.2. Raise together with bolero.
wasmparser = { version = "0.244.0", default-features = false, features = ["std", "validate", "features"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# 0.8, not 0.9: the sqlx-cli in nixpkgs is 0.8.6 and writes the offline query cache
# (.sqlx/) in its own version's format. Bump together with nixpkgs' sqlx-cli.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
thiserror = "2.0.21"
tracing = "0.1.44"

# ── binaries only ──
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# ── tests ──
bolero = "0.13.7"
wasm-encoder = "0.244.0"  # same release as wasmparser
tokio = "1.53.3"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code returns typed errors instead of panicking (tests are exempt, see clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
# `#[must_use]` is applied deliberately to values that are a bug to drop, not to every getter.
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
