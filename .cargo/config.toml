# mold through clang: the main build-speed lever. No cranelift backend: it breaks the
# sanitizer coverage that cargo-bolero and cargo-llvm-cov need.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
# Tests: nextest only, whole workspace.
t = "nextest run --workspace"
lint = "clippy --workspace --all-targets --all-features -- -D warnings"
